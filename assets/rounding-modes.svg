<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 900 380" width="900" height="380" font-family="monospace" font-size="11">
  <rect x="-69.5" y="0.5" width="899" height="379" fill="#f7f3e8" stroke="#d8cfbd" stroke-width="1"/>

  <!-- ===== Top: full segment [1, 2) with 16 ticks, highlight [1.25, 1.3125] ===== -->
  <!-- 16 等分 [1, 2)，每格 30px，整段 480px。1.25 = 4/16 -> x=120; 1.3125 = 5/16 -> x=150 -->
  <g transform="translate(40, 50)">
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="30"  y1="-4" x2="30"  y2="4"/>
      <line x1="60"  y1="-4" x2="60"  y2="4"/>
      <line x1="90"  y1="-4" x2="90"  y2="4"/>
      <line x1="120" y1="-5" x2="120" y2="5"/>
      <line x1="150" y1="-5" x2="150" y2="5"/>
      <line x1="180" y1="-4" x2="180" y2="4"/>
      <line x1="210" y1="-4" x2="210" y2="4"/>
      <line x1="240" y1="-4" x2="240" y2="4"/>
      <line x1="270" y1="-4" x2="270" y2="4"/>
      <line x1="300" y1="-4" x2="300" y2="4"/>
      <line x1="330" y1="-4" x2="330" y2="4"/>
      <line x1="360" y1="-4" x2="360" y2="4"/>
      <line x1="390" y1="-4" x2="390" y2="4"/>
      <line x1="420" y1="-4" x2="420" y2="4"/>
      <line x1="450" y1="-4" x2="450" y2="4"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <text x="0"   y="22" text-anchor="middle" fill="#333">1</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">2</text>
    <text x="-30" y="4"  text-anchor="end"   fill="#666">[1, 2) 段</text>
    <!-- highlight zoom region [1.25, 1.3125] -->
    <rect x="120" y="-8" width="30" height="16" fill="#1f4e8c" fill-opacity="0.15" stroke="none"/>
  </g>

  <!-- ===== Dashed lines connecting zoom region to expanded ruler ===== -->
  <!-- 放大轴顶部（含"末位"注释）在 y=120，虚线终点留出空间到 y=108 -->
  <g stroke="#1f4e8c" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <line x1="160" y1="60" x2="120" y2="108"/>
    <line x1="190" y1="60" x2="600" y2="108"/>
  </g>

  <!-- ===== Expanded ruler: only [1.25, 1.3125] ===== -->
  <!-- 内部坐标: 1.25 在 x=80, 1.3125 在 x=560, 长 480。 1.3 比例 0.8 -> x = 80 + 480*0.8 = 464 -->
  <g transform="translate(40, 150)">
    <line x1="80" y1="0" x2="560" y2="0" stroke="#333" stroke-width="1"/>
    <line x1="80"  y1="-8" x2="80"  y2="8" stroke="#333" stroke-width="1.6"/>
    <line x1="560" y1="-8" x2="560" y2="8" stroke="#333" stroke-width="1.6"/>
    <text x="80"  y="-16" text-anchor="middle" fill="#666">1.010<tspan fill="#1f4e8c" font-weight="bold">0</tspan></text>
    <text x="560" y="-16" text-anchor="middle" fill="#666">1.010<tspan fill="#1f4e8c" font-weight="bold">1</tspan></text>
    <text x="80"  y="-30" text-anchor="middle" fill="#1f4e8c" font-size="10">末位 0（偶）</text>
    <text x="560" y="-30" text-anchor="middle" fill="#1f4e8c" font-size="10">末位 1（奇）</text>
    <text x="80"  y="22"  text-anchor="middle" fill="#333">1.25</text>
    <text x="560" y="22"  text-anchor="middle" fill="#333">1.3125</text>
    <!-- 1.3 红色标记（文字放在短竖线右侧偏下，不占轴下方垂直空间） -->
    <line x1="464" y1="-10" x2="464" y2="10" stroke="#c0392b" stroke-width="2"/>
    <text x="470" y="11" fill="#c0392b" font-weight="bold">1.3</text>
    <!-- 平局点 1.28125（中点 x=320），round half to even 箭头指向 1.25 -->
    <line x1="320" y1="-10" x2="320" y2="10" stroke="#7a5195" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="320" y="34" text-anchor="middle" fill="#7a5195" font-weight="bold">1.28125</text>
    <!-- 箭头：从 1.28125 指向 1.25，规则名写在箭头上方 -->
    <defs>
      <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#7a5195"/>
      </marker>
    </defs>
    <line x1="310" y1="52" x2="92" y2="52" stroke="#7a5195" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
    <text x="200" y="48" text-anchor="middle" fill="#7a5195" font-size="10">round half to even</text>
  </g>

  <!-- ===== Four rule rows ===== -->
  <!-- 每行画两端点，用蓝色加粗标出"被选中"的那一条 -->
  <!-- 起始 y=235，每行间隔 32 -->

  <g transform="translate(40, 235)">
    <line x1="80" y1="0" x2="560" y2="0" stroke="#bbb" stroke-width="0.8"/>
    <circle cx="80"  cy="0" r="3" fill="#bbb"/>
    <circle cx="560" cy="0" r="5" fill="#1f4e8c"/>
    <text x="585" y="4" fill="#1f4e8c" font-weight="bold">向最近 → 1.3125（IEEE 754 默认）</text>
  </g>

  <g transform="translate(40, 267)">
    <line x1="80" y1="0" x2="560" y2="0" stroke="#bbb" stroke-width="0.8"/>
    <circle cx="80"  cy="0" r="5" fill="#f7f3e8" stroke="#8ca9c9" stroke-width="1.5"/>
    <circle cx="560" cy="0" r="3" fill="#bbb"/>
    <text x="585" y="4" fill="#333">向零 → 1.25</text>
  </g>

  <g transform="translate(40, 299)">
    <line x1="80" y1="0" x2="560" y2="0" stroke="#bbb" stroke-width="0.8"/>
    <circle cx="80"  cy="0" r="3" fill="#bbb"/>
    <circle cx="560" cy="0" r="5" fill="#f7f3e8" stroke="#8ca9c9" stroke-width="1.5"/>
    <text x="585" y="4" fill="#333">向 +∞ → 1.3125</text>
  </g>

  <g transform="translate(40, 331)">
    <line x1="80" y1="0" x2="560" y2="0" stroke="#bbb" stroke-width="0.8"/>
    <circle cx="80"  cy="0" r="5" fill="#f7f3e8" stroke="#8ca9c9" stroke-width="1.5"/>
    <circle cx="560" cy="0" r="3" fill="#bbb"/>
    <text x="585" y="4" fill="#333">向 −∞ → 1.25</text>
  </g>

  <!-- ===== 1.3 红色虚线（紧贴放大轴下沿延伸到"向最近"那一行） ===== -->
  <!-- 内部 x=464 + 40 = 504，从放大轴下沿（y=160）到第一行端点中心（y=235） -->
  <line x1="504" y1="160" x2="504" y2="235" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="2,3"/>
</svg>
