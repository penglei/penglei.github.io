<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 900 200" width="900" height="200" font-family="monospace" font-size="12">
  <rect x="-69.5" y="0.5" width="899" height="199" fill="#f7f3e8" stroke="#d8cfbd" stroke-width="1"/>

  <!-- 整条位序列：m 位目标尾数 + G + R + 低位折叠 + S，紧密相邻 -->
  <!-- 每格 40px 宽，高 40px，x 从 60 开始 -->

  <!-- 目标尾数 4 格：x 60-220 -->
  <g>
    <rect x="60"  y="70" width="40" height="40" fill="#1f4e8c" fill-opacity="0.25" stroke="#1f4e8c" stroke-width="1"/>
    <rect x="100" y="70" width="40" height="40" fill="#1f4e8c" fill-opacity="0.25" stroke="#1f4e8c" stroke-width="1"/>
    <rect x="140" y="70" width="40" height="40" fill="#1f4e8c" fill-opacity="0.25" stroke="#1f4e8c" stroke-width="1"/>
    <rect x="180" y="70" width="40" height="40" fill="#1f4e8c" fill-opacity="0.25" stroke="#1f4e8c" stroke-width="1"/>
    <path d="M 60 122 L 60 128 L 220 128 L 220 122" fill="none" stroke="#1f4e8c" stroke-width="1"/>
    <text x="140" y="146" text-anchor="middle" fill="#1f4e8c" font-size="11">m 位目标尾数</text>
  </g>

  <!-- Guard 格：x 220-260 -->
  <g>
    <rect x="220" y="70" width="40" height="40" fill="#d35400" fill-opacity="0.25" stroke="#d35400" stroke-width="1.2"/>
    <text x="240" y="60" text-anchor="middle" fill="#d35400" font-size="11" font-weight="bold">G</text>
  </g>

  <!-- Round 格：x 260-300 -->
  <g>
    <rect x="260" y="70" width="40" height="40" fill="#d35400" fill-opacity="0.12" stroke="#d35400" stroke-width="1"/>
    <text x="280" y="60" text-anchor="middle" fill="#d35400" font-size="11" font-weight="bold">R</text>
  </g>

  <!-- 低位折叠框：x 300-660 -->
  <g>
    <rect x="300" y="70" width="360" height="40" fill="#7a5195" fill-opacity="0.1" stroke="#7a5195" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="480" y="96" text-anchor="middle" fill="#7a5195" font-size="11">更低位（任意多）</text>
    <path d="M 300 122 L 300 128 L 660 128 L 660 122" fill="none" stroke="#7a5195" stroke-width="1"/>
  </g>

  <!-- Sticky 单格：x 660-700，紧挨低位框 -->
  <g>
    <rect x="660" y="70" width="40" height="40" fill="#7a5195" fill-opacity="0.35" stroke="#7a5195" stroke-width="1.2"/>
    <text x="680" y="60" text-anchor="middle" fill="#7a5195" font-size="11" font-weight="bold">S</text>
  </g>

  <!-- OR 折叠箭头：从低位框上方弧线落到 S 格左上角 -->
  <defs>
    <marker id="arrow-sticky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5195"/>
    </marker>
  </defs>
  <path d="M 480 70 Q 480 30 640 30 Q 660 30 660 50" fill="none" stroke="#7a5195" stroke-width="1.2" marker-end="url(#arrow-sticky)"/>
  <text x="560" y="22" text-anchor="middle" fill="#7a5195" font-size="11" font-weight="bold">OR 折叠</text>
</svg>
