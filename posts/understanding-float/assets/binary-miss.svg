<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 0 630 460" width="630" height="460" font-family="monospace" font-size="11">
  <rect x="-69.5" y="0.5" width="629" height="459" fill="#f7f3e8" stroke="#d8cfbd" stroke-width="1"/>
  <!-- ===== Red line at x = 88 (= 40 + 48), spanning all six rulers ===== -->
  <line x1="88" y1="30" x2="88" y2="425" stroke="#c0392b" stroke-width="1"/>
  <text x="88" y="22" text-anchor="middle" fill="#c0392b" font-weight="bold">0.1</text>

  <!-- ===== Decimal reference: 10 ticks on [0, 1] ===== -->
  <g transform="translate(40, 60)">
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="48"  y1="-6" x2="48"  y2="6"/>
      <line x1="96"  y1="-4" x2="96"  y2="4"/>
      <line x1="144" y1="-4" x2="144" y2="4"/>
      <line x1="192" y1="-4" x2="192" y2="4"/>
      <line x1="240" y1="-4" x2="240" y2="4"/>
      <line x1="288" y1="-4" x2="288" y2="4"/>
      <line x1="336" y1="-4" x2="336" y2="4"/>
      <line x1="384" y1="-4" x2="384" y2="4"/>
      <line x1="432" y1="-4" x2="432" y2="4"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <!-- 0.1 tick in blue: exactly on a tick -->
    <line x1="48" y1="-8" x2="48" y2="8" stroke="#1f4e8c" stroke-width="2"/>
    <text x="0"   y="22" text-anchor="middle" fill="#333">0</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">1</text>
    <text x="-30" y="4" text-anchor="end" fill="#666">B=10</text>
  </g>

  <!-- Separator -->
  <line x1="40" y1="110" x2="520" y2="110" stroke="#ddd" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="300" y="124" text-anchor="middle" fill="#666">同一个 0.1，在 B=2 的尺子上往下细分</text>

  <!-- ===== Binary layer 1: 2 ticks on [0, 1] ===== -->
  <g transform="translate(40, 160)">
    <!-- Highlight [0, 0.5] -->
    <rect x="0" y="-8" width="240" height="16" fill="#aaa" fill-opacity="0.2" stroke="none"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="240" y1="-6" x2="240" y2="6"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <text x="0"   y="22" text-anchor="middle" fill="#333">0</text>
    <text x="240" y="22" text-anchor="middle" fill="#333">1/2</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">1</text>
    <text x="-30" y="4" text-anchor="end" fill="#666">B=2, k=-1</text>
  </g>

  <!-- ===== Binary layer 2: 4 ticks on [0, 1] ===== -->
  <g transform="translate(40, 220)">
    <rect x="0" y="-8" width="120" height="16" fill="#aaa" fill-opacity="0.2" stroke="none"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="120" y1="-5" x2="120" y2="5"/>
      <line x1="240" y1="-6" x2="240" y2="6"/>
      <line x1="360" y1="-5" x2="360" y2="5"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <text x="0"   y="22" text-anchor="middle" fill="#333">0</text>
    <text x="120" y="22" text-anchor="middle" fill="#333">1/4</text>
    <text x="240" y="22" text-anchor="middle" fill="#333">1/2</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">1</text>
    <text x="-30" y="4" text-anchor="end" fill="#666">B=2, k=-2</text>
  </g>

  <!-- ===== Binary layer 3: 8 ticks on [0, 1] ===== -->
  <g transform="translate(40, 280)">
    <rect x="0" y="-8" width="60" height="16" fill="#aaa" fill-opacity="0.2" stroke="none"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="60"  y1="-5" x2="60"  y2="5"/>
      <line x1="120" y1="-5" x2="120" y2="5"/>
      <line x1="180" y1="-5" x2="180" y2="5"/>
      <line x1="240" y1="-6" x2="240" y2="6"/>
      <line x1="300" y1="-5" x2="300" y2="5"/>
      <line x1="360" y1="-5" x2="360" y2="5"/>
      <line x1="420" y1="-5" x2="420" y2="5"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <text x="0"   y="22" text-anchor="middle" fill="#333">0</text>
    <text x="60"  y="22" text-anchor="middle" fill="#333">1/8</text>
    <text x="240" y="22" text-anchor="middle" fill="#333">1/2</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">1</text>
    <text x="-30" y="4" text-anchor="end" fill="#666">B=2, k=-3</text>
  </g>

  <!-- ===== Binary layer 4: 16 ticks on [0, 1] ===== -->
  <g transform="translate(40, 340)">
    <rect x="30" y="-8" width="30" height="16" fill="#aaa" fill-opacity="0.2" stroke="none"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="30"  y1="-4" x2="30"  y2="4"/>
      <line x1="60"  y1="-5" x2="60"  y2="5"/>
      <line x1="90"  y1="-4" x2="90"  y2="4"/>
      <line x1="120" y1="-4" x2="120" y2="4"/>
      <line x1="150" y1="-4" x2="150" y2="4"/>
      <line x1="180" y1="-4" x2="180" y2="4"/>
      <line x1="210" y1="-4" x2="210" y2="4"/>
      <line x1="240" y1="-6" x2="240" y2="6"/>
      <line x1="270" y1="-4" x2="270" y2="4"/>
      <line x1="300" y1="-4" x2="300" y2="4"/>
      <line x1="330" y1="-4" x2="330" y2="4"/>
      <line x1="360" y1="-4" x2="360" y2="4"/>
      <line x1="390" y1="-4" x2="390" y2="4"/>
      <line x1="420" y1="-4" x2="420" y2="4"/>
      <line x1="450" y1="-4" x2="450" y2="4"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <text x="0"   y="22" text-anchor="middle" fill="#333">0</text>
    <text x="30"  y="22" text-anchor="middle" fill="#333">1/16</text>
    <text x="240" y="22" text-anchor="middle" fill="#333">1/2</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">1</text>
    <text x="-30" y="4" text-anchor="end" fill="#666">B=2, k=-4</text>
  </g>

  <!-- ===== Binary layer 5: 32 ticks on [0, 1] ===== -->
  <g transform="translate(40, 400)">
    <rect x="45" y="-8" width="15" height="16" fill="#aaa" fill-opacity="0.2" stroke="none"/>
    <line x1="0" y1="0" x2="480" y2="0" stroke="#333" stroke-width="1"/>
    <g stroke="#333" stroke-width="1">
      <line x1="0"   y1="-6" x2="0"   y2="6"/>
      <line x1="15"  y1="-3" x2="15"  y2="3"/>
      <line x1="30"  y1="-4" x2="30"  y2="4"/>
      <line x1="45"  y1="-3" x2="45"  y2="3"/>
      <line x1="60"  y1="-5" x2="60"  y2="5"/>
      <line x1="75"  y1="-3" x2="75"  y2="3"/>
      <line x1="90"  y1="-3" x2="90"  y2="3"/>
      <line x1="105" y1="-3" x2="105" y2="3"/>
      <line x1="120" y1="-4" x2="120" y2="4"/>
      <line x1="135" y1="-3" x2="135" y2="3"/>
      <line x1="150" y1="-3" x2="150" y2="3"/>
      <line x1="165" y1="-3" x2="165" y2="3"/>
      <line x1="180" y1="-3" x2="180" y2="3"/>
      <line x1="195" y1="-3" x2="195" y2="3"/>
      <line x1="210" y1="-3" x2="210" y2="3"/>
      <line x1="225" y1="-3" x2="225" y2="3"/>
      <line x1="240" y1="-6" x2="240" y2="6"/>
      <line x1="255" y1="-3" x2="255" y2="3"/>
      <line x1="270" y1="-3" x2="270" y2="3"/>
      <line x1="285" y1="-3" x2="285" y2="3"/>
      <line x1="300" y1="-3" x2="300" y2="3"/>
      <line x1="315" y1="-3" x2="315" y2="3"/>
      <line x1="330" y1="-3" x2="330" y2="3"/>
      <line x1="345" y1="-3" x2="345" y2="3"/>
      <line x1="360" y1="-3" x2="360" y2="3"/>
      <line x1="375" y1="-3" x2="375" y2="3"/>
      <line x1="390" y1="-3" x2="390" y2="3"/>
      <line x1="405" y1="-3" x2="405" y2="3"/>
      <line x1="420" y1="-3" x2="420" y2="3"/>
      <line x1="435" y1="-3" x2="435" y2="3"/>
      <line x1="450" y1="-3" x2="450" y2="3"/>
      <line x1="465" y1="-3" x2="465" y2="3"/>
      <line x1="480" y1="-6" x2="480" y2="6"/>
    </g>
    <text x="0"   y="22" text-anchor="middle" fill="#333">0</text>
    <text x="240" y="22" text-anchor="middle" fill="#333">1/2</text>
    <text x="480" y="22" text-anchor="middle" fill="#333">1</text>
    <text x="-30" y="4" text-anchor="end" fill="#666">B=2, k=-5</text>
  </g>

  <!-- Bottom equation -->
  <text x="280" y="450" text-anchor="middle" fill="#333" font-size="12">0.1 (B=10) = 0.00011 0011 0011 ... (B=2)</text>
</svg>
